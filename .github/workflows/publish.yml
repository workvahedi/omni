
name: Build patched OmniRoute

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout patched OmniRoute
        uses: actions/checkout@v4
        with:
          repository: TheDemonTuan/OmniRoute
          ref: 513389429ea22a9f583fe3496a5c89b83c775093
          persist-credentials: false

      - name: Set image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/omniroute-ssefix:3.8.55-p20466" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner-base
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
            OMNIROUTE_BUILD_MEMORY_MB=6144
            OMNIROUTE_BUILD_WORKERS=2
